name: Banana transition field Pages
on:
  push:
    branches: [main]
    paths:
      - 'branches/banana-transition-field/**'
      - 'branches/security-impact-learning/**'
      - '.github/workflows/banana-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banana-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - uses: actions/configure-pages@v6
      - name: Copy reviewed public application files
        shell: bash
        run: |
          mkdir -p _site
          for file in index.html app.mjs model.mjs project-universe.mjs style.css statement.json; do
            cp "branches/banana-transition-field/$file" "_site/$file"
          done
          mkdir -p _site/impact-learning
          for file in index.html README.md RETROSPECTIVE.md lessons.json sources.json fixtures.json impact-model.mjs cli-result-model.mjs demo.mjs; do
            cp "branches/security-impact-learning/$file" "_site/impact-learning/$file"
          done
          python3 - <<'PY'
          from pathlib import Path
          target = Path('_site/impact-learning/index.html')
          text = target.read_text(encoding='utf-8')
          prefix = 'https://github.com/Juri-Halveth/open-research-branches/blob/main/'
          text = text.replace('href="../../START_HERE_AI.md"', 'href="' + prefix + 'START_HERE_AI.md"')
          text = text.replace('href="../../wiki/HALVETH-Codeuniversum.md"', 'href="' + prefix + 'wiki/HALVETH-Codeuniversum.md"')
          target.write_text(text, encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
