name: Banana transition field Pages
on:
  push:
    branches: [main]
    paths:
      - 'branches/banana-transition-field/**'
      - '.github/workflows/banana-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: banana-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - uses: actions/configure-pages@v6
      - name: Copy reviewed public application files
        shell: bash
        run: |
          mkdir -p _site
          for file in index.html app.mjs model.mjs project-universe.mjs style.css statement.json; do
            cp "branches/banana-transition-field/$file" "_site/$file"
          done
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
