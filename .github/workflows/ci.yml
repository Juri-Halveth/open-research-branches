name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Local agent candidate gate (synthetic PowerShell cases)
        shell: pwsh
        run: ./scripts/agent-candidate.test.ps1
