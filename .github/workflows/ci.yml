name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - name: Check local command resolver without executing discovered tools
        shell: pwsh
        run: ./scripts/test-inspect-environment.ps1
      - run: python3 -m unittest discover -s branches/fegefeuer-provenance-transducer -p 'test_*.py' -v

      - run: python3 -m unittest discover -s branches/normenwerk-rule-universe -p 'test_*.py' -v
